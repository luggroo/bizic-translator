[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tujia-lex"
version = "0.1.0"
description = "Provenance-preserving Chinese semantic retrieval for Tujia translation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
loan-build = ["opencc-python-reimplemented>=0.1.7,<1"]
embedding = ["numpy>=1.26,<3", "torch>=2.6,<3", "transformers==4.51.3", "huggingface-hub==0.30.2", "safetensors>=0.5.3"]
test = ["pytest>=8,<9", "numpy>=1.26,<3"]

[project.scripts]
tujia-lex = "tujia_lex.cli:main"
tujia-loan = "tujia_lex.loan_lookup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: runs real pretrained inference; needs --model-path"]

[tool.setuptools.package-data]
tujia_lex = ["loan_data/*.json", "loan_data/*.json.gz"]
