name: Test Chinese-loan phonology

on:
  pull_request:
    paths:
      - 'data/loan-sources/**'
      - 'src/tujia_lex/loan_lookup.py'
      - 'src/tujia_lex/loan_build.py'
      - 'scripts/build-loan-readings.py'
      - 'scripts/build-loan-table.py'
      - 'scripts/build-local-readings.py'
      - 'scripts/export-register-table.py'
      - 'data/han-registers.*'
      - 'skills/translate-tujia/assets/local-readings.json.gz'
      - 'data/loan-readings-*.tsv'
      - 'src/tujia_lex/loan_data/**'
      - 'skills/translate-tujia/assets/loan-readings.json.gz'
      - 'skills/translate-tujia/scripts/lookup-loan.py'
      - 'tests/test_loan_lookup.py'
      - '.github/workflows/check-loan-phonology.yml'
  push:
    paths:
      - 'data/loan-sources/**'
      - 'src/tujia_lex/loan_lookup.py'
      - 'src/tujia_lex/loan_build.py'
      - 'scripts/build-loan-readings.py'
      - 'scripts/build-loan-table.py'
      - 'scripts/build-local-readings.py'
      - 'scripts/export-register-table.py'
      - 'data/han-registers.*'
      - 'skills/translate-tujia/assets/local-readings.json.gz'
      - 'data/loan-readings-*.tsv'
      - 'src/tujia_lex/loan_data/**'
      - 'skills/translate-tujia/assets/loan-readings.json.gz'
      - 'skills/translate-tujia/scripts/lookup-loan.py'
      - 'tests/test_loan_lookup.py'
      - '.github/workflows/check-loan-phonology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loan-phonology:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install -e '.[loan-build]' 'pytest>=8,<9'
      - name: Check northern and southern loan mapping
        run: python -m pytest tests/test_loan_lookup.py -q
      - name: Check compiled tables are current
        run: |
          python scripts/build-loan-readings.py
          python scripts/build-local-readings.py
          python scripts/export-register-table.py --tsv data/han-registers.tsv
          git diff --exit-code -- data/han-registers.tsv src/tujia_lex/loan_data/local-readings.json.gz skills/translate-tujia/assets/local-readings.json.gz
          git diff --exit-code -- src/tujia_lex/loan_data/readings.json.gz data/loan-readings-north.tsv data/loan-readings-south.tsv data/loan-sources/homophone-build-audit.json.gz data/loan-sources/compiled-readings-summary.json skills/translate-tujia/assets/loan-readings.json.gz skills/translate-tujia/scripts/lookup-loan.py
