name: Update readable Tujia lexicon
on:
  workflow_dispatch:
  schedule:
    - cron: "27 8 * * 2"
  push:
    paths:
      - scripts/export-readable-lexicon.py
      - .github/workflows/update-static-lexicon.yml

permissions:
  contents: write

concurrency:
  group: readable-tujia-lexicon
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one versioned public dictionary file
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(curl --fail --silent --show-error --location --retry 2 --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/luggroo/bizic-dictionary/commits/main" | \
            python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test "${#REVISION}" -eq 40
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            --max-filesize 12000000 \
            "https://raw.githubusercontent.com/luggroo/bizic-dictionary/${REVISION}/site/dictionary.json.gz" \
            -o "${RUNNER_TEMP}/dictionary.json.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            --max-filesize 12000000 \
            "https://raw.githubusercontent.com/luggroo/bizic-dictionary/${REVISION}/site/data.json.gz" \
            -o "${RUNNER_TEMP}/data.json.gz"
          python scripts/export-readable-lexicon.py build \
            --source "${RUNNER_TEMP}/dictionary.json.gz" \
            --metadata-source "${RUNNER_TEMP}/data.json.gz" \
            --output skills/translate-tujia/lexicon \
            --revision "${REVISION}"
      - name: Audit EVERY real dictionary entry and attestation before embedding
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import os
          from tujia_lex.data import lexical_records, read_json
          from tujia_lex.index import semantic_texts
          source = Path(os.environ["RUNNER_TEMP"]) / "dictionary.json.gz"
          words = read_json(source)["words"]
          lexical = lexical_records(source)
          source_entries = {w["id"] for w in words}
          source_witnesses = {a["id"] for w in words for a in w["attestations"]}
          actual_entries = {r["entry_id"] for r in lexical}
          actual_witnesses = {a["id"] for r in lexical for a in r["attestations"]}
          assert source_entries == actual_entries, "Missing dictionary entries in semantic input"
          assert source_witnesses == actual_witnesses, "Missing dictionary attestations in semantic input"
          assert all(semantic_texts(r) for r in lexical)
          assert all(r["en"] in semantic_texts(r) for r in lexical if r.get("en"))
          print(f"Verified {len(source_entries)} entries, {len(source_witnesses)} attestations, "
                f"{len(lexical)} distinct senses with all available Chinese/English semantic fields")
          PY
      - name: Test shard coverage, source isolation, and bilingual embedding indexing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy>=1.26,<3" "pytest>=8,<9"
          PYTHONPATH=src python -m pytest -q tests/test_static_and_embedding_coverage.py
      - name: Smoke test static exact lookup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export-readable-lexicon.py lookup \
            --directory skills/translate-tujia/lexicon --query "好" --limit 5 > /dev/null
      - name: Commit updated text-only shards, if necessary
        shell: bash
        run: |
          set -euo pipefail
          git add skills/translate-tujia/lexicon
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update static text lexicon from public dictionary"
            # Reconcile unrelated edits made during a running export; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
