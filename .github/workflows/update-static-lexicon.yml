name: Update readable Tujia lexicon
on:
  workflow_dispatch:
  schedule:
    - cron: "27 8 * * *"
  pull_request:
    paths:
      - scripts/verify-site-contract.py
      - scripts/export-readable-lexicon.py
      - scripts/tujia-lex-spelling.cjs
      - tests/test_site_contract.py
      - .github/workflows/update-static-lexicon.yml
  push:
    paths:
      - scripts/export-readable-lexicon.py
      - scripts/verify-site-contract.py
      - scripts/tujia-lex-spelling.cjs
      - .github/workflows/update-static-lexicon.yml

permissions:
  contents: write

concurrency:
  group: readable-tujia-lexicon
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout canonical public source at one immutable revision
        uses: actions/checkout@v4
        with:
          repository: luggroo/bizic-dictionary
          path: _source
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            site/dictionary.json.gz
            site/data.json.gz
            site/ipa-normalize.js
            site/notation-profiles.js
            site/notation-ui.js
            site/southern-notation.js
            site/yubao.js
            site/grammar-notation.js
            site/lexical-reviews.js
            site/spelling-boundaries.js
          sparse-checkout-cone-mode: false
      - name: Prepare pinned dictionary and matching site converters
        id: source
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(git -C _source rev-parse HEAD)"
          test "${#REVISION}" -eq 40
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          mkdir -p "${RUNNER_TEMP}/bizic/site"
          for file in dictionary.json.gz data.json.gz ipa-normalize.js notation-profiles.js notation-ui.js southern-notation.js yubao.js grammar-notation.js lexical-reviews.js spelling-boundaries.js; do
            cp "_source/site/${file}" "${RUNNER_TEMP}/bizic/site/${file}"
          done
      - name: Detect source, converter or shard drift
        id: drift
        shell: bash
        run: |
          if python scripts/verify-site-contract.py \
            --source "${RUNNER_TEMP}/bizic/site/dictionary.json.gz" \
            --metadata-source "${RUNNER_TEMP}/bizic/site/data.json.gz" \
            --site-root "${RUNNER_TEMP}/bizic/site" \
            --directory skills/translate-tujia/lexicon; then
            echo "update_needed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "update_needed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Refuse unattended breaking ID or source migrations
        if: steps.drift.outputs.update_needed == 'true'
        shell: bash
        run: |
          python scripts/verify-site-contract.py \
            --source "${RUNNER_TEMP}/bizic/site/dictionary.json.gz" \
            --metadata-source "${RUNNER_TEMP}/bizic/site/data.json.gz" \
            --site-root "${RUNNER_TEMP}/bizic/site" \
            --directory skills/translate-tujia/lexicon \
            --check-previous-identities
      - name: Rebuild only if canonical inputs, notation or shards changed
        if: steps.drift.outputs.update_needed == 'true'
        shell: bash
        run: |
          python scripts/export-readable-lexicon.py build \
            --source "${RUNNER_TEMP}/bizic/site/dictionary.json.gz" \
            --metadata-source "${RUNNER_TEMP}/bizic/site/data.json.gz" \
            --site-root "${RUNNER_TEMP}/bizic/site" \
            --output skills/translate-tujia/lexicon \
            --revision "${{ steps.source.outputs.revision }}"
      - name: Verify all static shards and the complete canonical witness set
        shell: bash
        run: |
          python scripts/verify-site-contract.py \
            --source "${RUNNER_TEMP}/bizic/site/dictionary.json.gz" \
            --metadata-source "${RUNNER_TEMP}/bizic/site/data.json.gz" \
            --site-root "${RUNNER_TEMP}/bizic/site" \
            --directory skills/translate-tujia/lexicon
      - name: Test shard coverage, source isolation, and bilingual embedding indexing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "numpy>=1.26,<3" "pytest>=8,<9"
          PYTHONPATH=src python -m pytest -q tests/test_static_and_embedding_coverage.py --data-root "${RUNNER_TEMP}/bizic"
      - name: Audit EVERY real dictionary entry and attestation before embedding
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import os
          from tujia_lex.data import lexical_records, read_json
          from tujia_lex.index import semantic_texts
          source = Path(os.environ["RUNNER_TEMP"]) / "bizic/site/dictionary.json.gz"
          words = read_json(source)["words"]
          lexical = lexical_records(source)
          source_entries = {w["id"] for w in words}
          source_witnesses = {a["id"] for w in words for a in w["attestations"]}
          actual_entries = {r["entry_id"] for r in lexical}
          actual_witnesses = {a["id"] for r in lexical for a in r["attestations"]}
          assert source_entries == actual_entries, "Missing dictionary entries in semantic input"
          assert source_witnesses == actual_witnesses, "Missing dictionary attestations in semantic input"
          assert all(semantic_texts(r) for r in lexical)
          assert all(r["en"] in semantic_texts(r) for r in lexical if r.get("en"))
          print(f"Verified {len(source_entries)} entries, {len(source_witnesses)} attestations, "
                f"{len(lexical)} distinct senses with all available Chinese/English semantic fields")
          PY
      - name: Smoke test static exact lookup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export-readable-lexicon.py lookup \
            --directory skills/translate-tujia/lexicon --query "好" --limit 5 > /dev/null
      - name: Commit updated text-only shards, if necessary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add skills/translate-tujia/lexicon
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update static text lexicon from public dictionary"
            # Reconcile unrelated edits made during a running export; never force-push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
